services:
  database:
    build: ./database
    container_name: openreview-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - openreview-network

  backend:
    build: ./backend
    container_name: openreview-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://database:27017/openreview
      - PORT=5000
    depends_on:
      - database
    networks:
      - openreview-network

  frontend:
    build: ./frontend
    container_name: openreview-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - openreview-network

networks:
  openreview-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
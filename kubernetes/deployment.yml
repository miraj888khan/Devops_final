# (Keep your existing openreview-deployment and openreview-db-deployment here)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreview-sql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openreview-sql
  template:
    metadata:
      labels:
        app: openreview-sql
    spec:
      containers:
      - name: sql-container
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "openreview_sql"
apiVersion: v1
kind: Service
metadata:
  name: openreview-public-service
spec:
  type: NodePort
  ports:
  - name: frontend-port
    port: 80
    targetPort: 80
    nodePort: 32000
  - name: backend-port
    port: 5000
    targetPort: 5000
    nodePort: 32500
  selector:
    app: openreview-tier
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-cluster-service
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: openreview-db